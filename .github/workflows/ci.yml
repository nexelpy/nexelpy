name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -e ".[test]" || pip install -e . && pip install pytest pytest-cov pytest-asyncio
      - name: Run tests
        run: pytest tests/ --cov=nexelpy --cov-fail-under=90