name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio httpx2 python-multipart
          
      - name: Run tests
        run: |
          pytest tests/ --cov=nexelpy --cov-fail-under=90 \
            --junitxml=report.xml \
            --cov-report=lcov:coverage/lcov.info

      - name: Test Report
        uses: dorny/test-reporter@v2
        with:
          name: Pytest Results
          path: "report.xml"
          reporter: python-xunit
        if: always()

      - name: Coverage Report
        uses: mridang/action-test-reporter@v1
        with:
          coverage-file: "coverage/lcov.info"
        if: always()