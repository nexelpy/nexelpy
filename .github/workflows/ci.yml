name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov pytest-asyncio httpx2 python-multipart
          
      - name: Run tests
        run: |
          pytest tests/ --cov=nexelpy --cov-fail-under=90 \
            --junitxml=report.xml \
            --cov-report=lcov:coverage/lcov.info

      - name: Test Report
        uses: mridang/action-test-reporter@v1
        with:
          results-path: "report.xml"
          coverage-path: "coverage/lcov.info"
        if: always()